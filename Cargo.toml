[package]
name = "pingap-k8s"
version = "0.16.20"
edition = "2024"
rust-version = "1.89"
description = "Kubernetes endpoint discovery and Gateway API provider for Pingap, through its etcd config"
license = "Apache-2.0"
repository = "https://github.com/mehdyhaghy/pingap-k8s"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pingap-k8s"
path = "src/main.rs"

# kubectl plugin. Not part of the controller image.
[[bin]]
name = "kubectl-pingap"
path = "src/bin/kubectl-pingap.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
etcd-client = { version = "0.21", features = ["tls", "tls-native-roots"] }
futures = "0.3"
humantime = "2"
humantime-serde = "1"
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_35"] }
kube = { version = "4.2", default-features = false, features = ["client", "derive", "runtime", "rustls-tls"] }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics", "logs"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "metrics", "logs", "internal-logs", "tls-ring", "tls-roots"] }
opentelemetry-prometheus = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "logs"] }
# The PEM decoder Pingap validates certificates with (strict base64).
pem = "3"
prometheus = { version = "0.14", default-features = false }
regex = "1"
rustls-pki-types = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "~1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
# The certificate names (SAN) of a listener Secret, read the way Pingap reads them.
x509-parser = "0.18"
# Pins the ASCII-only backend of `idna` (via `url`, for health-check URLs, whose
# hosts are Kubernetes names): the Unicode backends pull in Unicode-3.0 licensed
# crates, which are not on the CNCF license allowlist. Not used directly.
idna_adapter = "~1.0"

[dev-dependencies]
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "metrics", "logs"] }
tokio = { version = "~1.53", features = ["test-util"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http = "1"
rcgen = "0.14.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
debug = false
