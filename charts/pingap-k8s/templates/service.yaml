{{- /* Metrics and health. Always ClusterIP: reachable inside the cluster only. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pingap-k8s.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingap-k8s.labels" . | nindent 4 }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "pingap-k8s.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
