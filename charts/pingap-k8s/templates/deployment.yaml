{{- $etcdSecret := include "pingap-k8s.etcd.clientSecret" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pingap-k8s.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingap-k8s.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pingap-k8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pingap-k8s.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pingap-k8s.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "pingap-k8s.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/pingap-k8s/config/config.toml
            - --log-format
            - {{ .Values.logFormat }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- /* $(VAR) expands the env vars above (downward API). */}}
            {{- $otelAttrs := list "k8s.namespace.name=$(POD_NAMESPACE)" "k8s.pod.name=$(POD_NAME)" (printf "k8s.deployment.name=%s" (include "pingap-k8s.fullname" .)) }}
            {{- range $k, $v := .Values.otel.resourceAttributes }}
            {{- $otelAttrs = append $otelAttrs (printf "%s=%v" $k $v) }}
            {{- end }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ join "," $otelAttrs | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pingap-k8s/config
              readOnly: true
            {{- if $etcdSecret }}
            - name: etcd-tls
              mountPath: {{ include "pingap-k8s.etcd.tlsDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          {{- if .Values.config.useSecret }}
          secret:
            secretName: {{ include "pingap-k8s.fullname" . }}-config
            defaultMode: 0440
          {{- else }}
          configMap:
            name: {{ include "pingap-k8s.fullname" . }}-config
          {{- end }}
        {{- if $etcdSecret }}
        - name: etcd-tls
          secret:
            secretName: {{ $etcdSecret }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "pingap-k8s.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
