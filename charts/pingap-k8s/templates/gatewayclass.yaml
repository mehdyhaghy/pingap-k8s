{{- /*
The GatewayClass of the Gateway API provider (cluster-scoped). Needs the
Gateway API CRDs installed before the chart.
*/ -}}
{{- if and .Values.gateway.enabled .Values.gateway.className }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
  labels:
    {{- include "pingap-k8s.labels" . | nindent 4 }}
spec:
  controllerName: {{ required "gateway.controllerName is required" .Values.gateway.controllerName }}
{{- end }}
