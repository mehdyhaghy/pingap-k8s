{{- /*
Optional quickstart: the stock Pingap image, unchanged, reading its config from
etcd and hot-reloading it (--conf etcd://... --autoreload).
*/ -}}
{{- if .Values.pingap.deploy }}
{{- $p := .Values.pingap }}
{{- $etcdSecret := include "pingap-k8s.pingap.etcdSecret" . }}
{{- $image := printf "%s:%s" $p.image.repository $p.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pingap-k8s.pingap.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingap-k8s.pingap.labels" . | nindent 4 }}
spec:
  replicas: {{ $p.replicas }}
  # Surge one new pod and wait for it to be ready before an old one stops.
  strategy:
    {{- toYaml $p.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pingap-k8s.pingap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pingap-k8s.pingap.selectorLabels" . | nindent 8 }}
        {{- with $p.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $p.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $p.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $p.podSecurityContext | nindent 8 }}
      {{- if $p.seed.enabled }}
      initContainers:
        - name: seed
          image: {{ $image }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          command: ["bash", "/etc/pingap-seed/seed.sh"]
          env:
            - name: PINGAP_ETCD_URL
              value: {{ include "pingap-k8s.pingap.etcdUrl" . | quote }}
          securityContext:
            {{- toYaml $p.securityContext | nindent 12 }}
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: seed
              mountPath: /etc/pingap-seed
              readOnly: true
            {{- if $etcdSecret }}
            - name: etcd-tls
              mountPath: {{ include "pingap-k8s.etcd.tlsDir" . }}
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: pingap
          image: {{ $image }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          command: ["pingap"]
          args:
            - --conf
            - {{ include "pingap-k8s.pingap.etcdUrl" . | quote }}
            - --autoreload
            {{- range $p.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # [::] takes IPv4 too (pingora sets IPV6_V6ONLY only on request, so
            # the socket is dual-stack on Linux; checked with Pingap 0.16.1: the
            # admin answers on 127.0.0.1, ::1 and the pod IPv4), and works on
            # IPv6-only clusters, where 0.0.0.0 would fail the liveness probe.
            - name: PINGAP_ADMIN_ADDR
              value: "[::]:{{ $p.admin.port }}"
            - name: PINGAP_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pingap-k8s.pingap.adminSecret" . }}
                  key: user
            - name: PINGAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pingap-k8s.pingap.adminSecret" . }}
                  key: password
            {{- with $p.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $p.httpPort }}
              protocol: TCP
            - name: admin
              containerPort: {{ $p.admin.port }}
              protocol: TCP
          {{- if $p.preStopSleepSeconds }}
          # Keep serving while the Service endpoints, kube-proxy and load
          # balancers stop sending to this pod; SIGTERM comes after the sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $p.preStopSleepSeconds }}
          {{- end }}
          # Pingap has no built-in health endpoint without extra config, so
          # readiness is the proxy listener accepting connections.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- toYaml $p.securityContext | nindent 12 }}
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $etcdSecret }}
            - name: etcd-tls
              mountPath: {{ include "pingap-k8s.etcd.tlsDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $p.seed.enabled }}
        - name: seed
          configMap:
            name: {{ include "pingap-k8s.pingap.fullname" . }}-seed
        {{- end }}
        {{- if $etcdSecret }}
        - name: etcd-tls
          secret:
            secretName: {{ $etcdSecret }}
            defaultMode: 0440
        {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- if $p.topologySpreadConstraints }}
        {{- toYaml $p.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pingap-k8s.pingap.selectorLabels" . | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
        {{- end }}
{{- end }}
