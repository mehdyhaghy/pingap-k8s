{{- /*
Admin credentials for the quickstart Pingap. An empty password is generated
once and reused on upgrade (looked up from the existing Secret).
*/ -}}
{{- if and .Values.pingap.deploy (not .Values.pingap.admin.existingSecret) }}
{{- $name := include "pingap-k8s.pingap.adminSecret" . }}
{{- $password := .Values.pingap.admin.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingap-k8s.pingap.labels" . | nindent 4 }}
type: Opaque
stringData:
  user: {{ .Values.pingap.admin.user | quote }}
  password: {{ $password | quote }}
{{- end }}
