# Default values for pingap-k8s.

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Controller
# ---------------------------------------------------------------------------

image:
  repository: ghcr.io/mehdyhaghy/pingap-k8s
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Two replicas: only the elected leader writes, the follower keeps its watches warm.
replicaCount: 2

# Log output of the controller: "text" or "json".
logFormat: text
# RUST_LOG style filter, e.g. "info" or "info,pingap_k8s=debug".
logLevel: info

serviceAccount:
  create: true
  # Defaults to the full name of the release.
  name: ""
  annotations: {}

rbac:
  # Create one Role + RoleBinding (read-only: get/list/watch on services and
  # endpointslices) in each namespace the controller reads. Never a ClusterRole.
  create: true
  # Namespaces to grant read access in.
  namespaces: []
  # Also add every namespace referenced by config.upstreams[*].services
  # (entries "<service>.<namespace>:<port>"; entries without a namespace use
  # config.kubernetes.default_namespace, or the release namespace when that is empty).
  fromConfig: true

events:
  # Post Kubernetes Events for resolve warnings, drain fallbacks and etcd
  # reachability (reasons in the README, "Observability"). Adds create/patch on
  # events.k8s.io events to the Roles above and to one in the release namespace.
  # Restarts the controller pods.
  enabled: false

gateway:
  # Gateway API provider (needs the Gateway API v1.7.0 Standard-channel CRDs;
  # see the README, "Gateway API"). Gateways of the GatewayClasses with
  # controllerName, and their ListenerSets, HTTPRoutes and GRPCRoutes, become
  # Pingap entries named "k8s-..." in the same etcd prefix. Grants the chart's
  # only ClusterRole (read the Gateway API resources, patch their status).
  # Changing enabled, controllerName or maxTxnOps restarts the controller pods;
  # the other settings apply live.
  enabled: false
  controllerName: pingap.io/gateway-controller
  # GatewayClass created by the chart (cluster-scoped); empty: none.
  className: pingap
  # Namespaces of backend Services and listener certificate Secrets. Each gets
  # the Service/EndpointSlice read Role plus get/list/watch on secrets.
  namespaces: []
  # Restrict that Secret access to these names (Role resourceNames), e.g.
  # ["web-tls"]. Empty: every Secret in those namespaces.
  secretNames: []
  # The gateway namespaces also get get/list/watch on configmaps, for the CA
  # certificates (ca.crt) of BackendTLSPolicies. Restrict it to these names
  # (Role resourceNames), e.g. ["backend-ca"]. Empty: every ConfigMap in those
  # namespaces.
  configMapNames: []
  # Pingap servers (already in etcd) listeners may be mapped onto, by port and
  # TLS (global_certificates). Empty: every stored server. The controller never
  # creates servers.
  servers: []
  # Allow ExternalName Service backends (Pingap DNS discovery on the external
  # name).
  externalName: false
  # Written to status.addresses of accepted Gateways: IPs or hostnames clients
  # use to reach Pingap.
  addresses: []
  # Server groups: Pingap servers "gw-<name>-<port>" and an address given to one
  # Gateway at a time (README, "Server groups"); servers and addresses above
  # are shared by the other Gateways. The servers are added to the seed (empty
  # etcd prefix only: add them by hand to an existing one and restart Pingap).
  # With pingap.deploy, a Service "<release>-pingap-gw-<name>" (type and
  # annotations of pingap.service) maps each listener port onto its server; its
  # DNS name is the group's address unless addresses is set (required without
  # pingap.deploy).
  #   - name: a
  #     ports:
  #       - port: 80          # Gateway listener port (Service port)
  #         targetPort: 9080  # port of the Pingap server
  #       - port: 443
  #         targetPort: 9443
  #         tls: true         # HTTPS listeners (global_certificates server)
  #         settings: {}      # more fields of the Pingap server, e.g. enabled_h2
  #     addresses: []
  groups: []
  # Pingap health_check of generated upstreams, e.g.
  # "http://k8s/healthz?connection_timeout=1s&check_frequency=5s".
  # Empty: Pingap's default TCP check.
  healthCheck: ""
  # Operations per etcd transaction of the Gateway writer ([gateway]
  # max_txn_ops, 2 to 1024). Keep it below the etcd server's --max-txn-ops
  # (128 by default).
  maxTxnOps: 64

etcd:
  # Pingap's etcd URL, the same string Pingap gets with --conf:
  #   etcd://host:port[,host:port]/<prefix>?ca=..&cert=..&key=..
  # When empty: built for the bundled etcd if etcd.deploy is true, otherwise
  # "etcd://etcd:2379/pingap" (a Service named etcd in the release namespace).
  # Do not put passwords in it: it is stored in the ConfigMap. Use client
  # certificates (etcd.tlsSecret) instead.
  url: ""
  # Name of an existing Secret with the controller's etcd client TLS files.
  # It is mounted read-only at /etc/pingap-k8s/etcd, so the URL can reference
  # e.g. ca=/etc/pingap-k8s/etcd/ca.crt&cert=/etc/pingap-k8s/etcd/tls.crt&key=/etc/pingap-k8s/etcd/tls.key
  # When empty and etcd.deploy is true with tls.autoGenerate, a generated one is used.
  tlsSecret: ""
  # File names inside the TLS Secrets (controller, Pingap and etcd server).
  tlsKeys:
    ca: ca.crt
    cert: tls.crt
    key: tls.key

  # --- Optional bundled etcd (off by default) -------------------------------
  # A StatefulSet with a ClusterIP Service, client certificate auth, and a
  # NetworkPolicy admitting only Pingap and pingap-k8s pods. It is never
  # exposed outside the cluster.
  deploy: false
  # 1 or 3.
  replicas: 1
  # Key prefix used when the URL is built for the bundled etcd.
  prefix: pingap
  image:
    repository: quay.io/coreos/etcd
    tag: v3.7.3
    pullPolicy: IfNotPresent
  tls:
    # Generate a CA, the etcd server certificate and client certificates for the
    # controller and the quickstart Pingap. Existing Secrets are reused on upgrade.
    autoGenerate: true
    validityDays: 3650
    # When autoGenerate is false: existing Secrets (files named by etcd.tlsKeys).
    # Server certificate, also used for peer traffic; it needs serverAuth and
    # clientAuth usages and SANs for the Services (see README).
    serverSecret: ""
    # Client certificate for the quickstart Pingap (pingap.etcdTlsSecret wins).
    pingapClientSecret: ""
    # Common name a peer certificate must have (--peer-cert-allowed-cn), so the
    # client certificates, signed by the same CA, cannot join as a member.
    # Empty: the etcd fullname with autoGenerate (the generated server CN), no
    # check otherwise. Set it to your server certificate's CN.
    peerAllowedCN: ""
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Extra command line flags for etcd, e.g. ["--quota-backend-bytes=2147483648"].
  extraArgs: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  networkPolicy:
    enabled: true
    # Pods (in the release namespace) that may connect to etcd as clients, in
    # addition to the controller and the quickstart Pingap. Label your own
    # Pingap pods with these labels, or change them.
    pingapPodLabels:
      app.kubernetes.io/name: pingap
    # Set to a namespace selector when your Pingap runs in another namespace,
    # e.g. {matchLabels: {kubernetes.io/metadata.name: edge}}.
    pingapNamespaceSelector: null
    # Extra raw NetworkPolicy "from" peers for the client port.
    extraFrom: []
  podDisruptionBudget:
    # Only rendered for 3 replicas (minAvailable: 2).
    enabled: true

# ---------------------------------------------------------------------------
# Controller config, rendered as TOML into the ConfigMap (see README).
# ---------------------------------------------------------------------------
config:
  kubernetes:
    # Empty: in-cluster, then $KUBECONFIG, then ~/.kube/config.
    kubeconfig: ""
    context: ""
    # Empty: the controller pod's own namespace.
    default_namespace: ""
    # Cluster DNS domain used for target = "service" addresses
    # (<service>.<namespace>.svc.<cluster_domain>:<port>). Applies live.
    cluster_domain: cluster.local
  defaults:
    include_not_ready: false
    drain_terminating: true
    debounce: "500ms"
    debounce_max: "2s"
    # Full re-list and re-reconcile, corrects drift.
    resync: "5m"
    # Address families written: "primary" (default; one address per pod, in the
    # Service's primary family), "ipv4", "ipv6" or "both". Replaces the
    # deprecated ipv4_only (true is "ipv4", false is "primary"); set one of the
    # two, not both. Left unset here so values that set ipv4_only keep working.
    # ip_family: primary
    # ExternalName Services write <externalName>:<port> (Pingap resolves the
    # name). Off: skipped with a warning in "pods" mode. On: anyone who can
    # create Services in a listed namespace can point the upstream at any host.
    external_name: false
    # What the controller writes into Pingap's addrs: "pods" (ready pod IPs) or
    # "service" (the Service's ClusterIP; README, "Upstream target").
    target: pods
  # One entry per Pingap upstream the controller owns. Every key of defaults
  # but resync (global) can be overridden per upstream. Example:
  #   upstreams:
  #     api:
  #       services: ["api.prod:http"]
  #     web:
  #       services: ["web-blue.prod:http 9", "web-green.prod:http 1"]
  #       drain_terminating: true
  #     legacy:
  #       services: ["legacy.prod:http"]
  #       target: service
  upstreams: {}
  # Optional [server] table (metrics/health listener), passed through as is.
  # Empty: [::]:9090 (also IPv4, see the seed listener note below); on nodes
  # booted with IPv6 disabled use {listen: "0.0.0.0:9090"}. Restarts the pods.
  server: {}
  # Store the rendered config in a Secret instead of a ConfigMap.
  useSecret: false

# Port of /metrics, /healthz and /readyz. Must match config.server when that is set.
metricsPort: 9090

metrics:
  service:
    # Always ClusterIP: metrics are reachable inside the cluster only.
    port: 9090
    annotations: {}

# Read-only /status endpoint for the kubectl plugin (`kubectl pingap status`).
# When enabled the controller listens on 127.0.0.1:<port> inside the pod only:
# no Service, no containerPort, not reachable from the network. Access is via
# `kubectl port-forward` to a pod, so it is gated by RBAC on pods/portforward.
# The JSON holds no secrets. Enabling it restarts the controller pods.
status:
  enabled: false
  port: 9091

# NetworkPolicy for the controller pods (on by default). The metrics/health port
# accepts traffic only from the sources below; everything else is denied, so
# list your Prometheus here to scrape /metrics. Kubelet probes and port-forward
# keep working (node-to-pod traffic is always allowed). Egress is not restricted.
networkPolicy:
  enabled: true
  # Allow pods in the release namespace (for example a scraper running there).
  allowSameNamespace: false
  # NetworkPolicy "from" peers allowed to scrape /metrics, for example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  metricsFrom: []

# OpenTelemetry (metrics + logs over OTLP/gRPC). /metrics is served either way.
otel:
  # OTLP gRPC endpoint of a collector on the private/cluster network, e.g.
  # "http://otel-collector.observability.svc:4317". Never a public address.
  # Empty: no OTLP export.
  endpoint: ""
  # Extra resource attributes, added to k8s.namespace.name, k8s.pod.name and
  # k8s.deployment.name, e.g. {deployment.environment.name: prod}.
  resourceAttributes: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  periodSeconds: 5
  failureThreshold: 3

terminationGracePeriodSeconds: 30
priorityClassName: ""
nodeSelector: {}
tolerations: []
# When empty, a soft anti-affinity spreads replicas over nodes.
affinity: {}
topologySpreadConstraints: []

extraEnv: []

# ---------------------------------------------------------------------------
# Optional quickstart Pingap (off by default): the stock Pingap image, unchanged,
# started with --conf etcd://... --autoreload.
# ---------------------------------------------------------------------------
pingap:
  deploy: false
  # Use 2 or more in production: the PodDisruptionBudget below only applies then.
  replicas: 1
  image:
    # The Debian based image: the seed step below needs its shell.
    repository: vicanso/pingap
    tag: "0.16.1"
    pullPolicy: IfNotPresent
  # etcd URL for Pingap. Empty: the controller's URL (etcd.url, or the one built
  # for the bundled etcd). Pingap's client TLS Secret is mounted at the same
  # path as the controller's (/etc/pingap-k8s/etcd), so the same URL works.
  etcdUrl: ""
  # Existing Secret with Pingap's etcd client TLS files. Empty: the generated
  # one (bundled etcd), else etcd.tlsSecret.
  etcdTlsSecret: ""
  # Proxy listener. Must match the server addr in seed.config.
  httpPort: 8080
  service:
    # The proxy Service. ClusterIP by default; set LoadBalancer or NodePort to
    # expose Pingap's listener.
    type: ClusterIP
    port: 80
    nodePort: null
    annotations: {}
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    # Dual-stack: SingleStack, PreferDualStack or RequireDualStack, and the
    # families in order (e.g. [IPv6, IPv4]). Empty: the cluster default.
    ipFamilyPolicy: ""
    ipFamilies: []
  admin:
    # Admin UI listener; its Service is always ClusterIP (use kubectl port-forward).
    port: 3018
    user: admin
    # Empty: a random password is generated and kept in the Secret across upgrades.
    password: ""
    # Use an existing Secret with keys "user" and "password" instead.
    existingSecret: ""
  # NetworkPolicy for the quickstart Pingap pods. Proxy traffic on httpPort (and
  # extraPorts) is allowed from anywhere; the admin port only from adminFrom.
  # kubectl port-forward and kubelet probes do not go through NetworkPolicy, so
  # `kubectl pingap admin` keeps working with adminFrom empty.
  networkPolicy:
    enabled: true
    # Further listener ports of your seed config, e.g. [8443].
    extraPorts: []
    # NetworkPolicy "from" peers allowed to reach the admin port, e.g.
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: ops
    adminFrom: []
  # Seed Pingap's etcd prefix once, before Pingap starts, only when it has no
  # server yet (Pingap reads servers and [basic] at start only).
  seed:
    enabled: true
    # Pingap TOML. The upstream "quickstart" starts with a placeholder address;
    # map it to a Service in config.upstreams and the controller fills it.
    #
    # Listener: "[::]:8080" alone. On Linux an "[::]" socket also takes IPv4
    # (unless net.ipv6.bindv6only=1), so adding "0.0.0.0:8080" would fail with
    # "address in use". On nodes booted with IPv6 disabled use "0.0.0.0:8080".
    #
    # [basic]: on SIGTERM Pingap stops listening, sleeps grace_period (default
    # 5m), then gives its runtimes graceful_shutdown_timeout. Keep
    # preStopSleepSeconds + grace_period + graceful_shutdown_timeout below
    # terminationGracePeriodSeconds: 15s + 30s + 10s = 55s < 60s.
    config: |
      [basic]
      grace_period = "30s"
      graceful_shutdown_timeout = "10s"

      [servers.quickstart]
      addr = "[::]:8080"
      locations = ["quickstart"]

      [locations.quickstart]
      upstream = "quickstart"

      [upstreams.quickstart]
      addrs = ["127.0.0.1:9"]
  extraArgs: []
  extraEnv: []
  # Extra labels and annotations on the Pingap pods, for example, labels or
  # annotations a service mesh needs to include this pod.
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  # Pod lifecycle on deletion: the pod leaves the Service endpoints, preStop
  # sleeps preStopSleepSeconds while load balancers catch up, then Pingap gets
  # SIGTERM and shuts down gracefully (seed.config [basic]); SIGKILL comes at
  # terminationGracePeriodSeconds, counted from the start of preStop.
  terminationGracePeriodSeconds: 60
  # 0 disables the preStop hook.
  preStopSleepSeconds: 15
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  podDisruptionBudget:
    # Rendered only when replicas > 1.
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Empty: spread replicas over nodes (maxSkew 1, kubernetes.io/hostname,
  # ScheduleAnyway). Set a list to replace that default.
  topologySpreadConstraints: []
