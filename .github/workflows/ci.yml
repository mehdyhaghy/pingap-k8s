name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly e2e run against the newest Pingap image.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HELM_VERSION: v4.3.1

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # etcd-client generates its gRPC code with protoc at build time;
      # libprotobuf-dev provides the well-known .proto files it imports.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

  helm:
    name: helm lint and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: make helm-lint

      - name: helm template
        run: make helm-template

      - name: plain manifests are up to date
        run: make manifests-check

      - name: no public exposure of etcd, metrics or admin; no ClusterRole
        run: make exposure-check

  docker:
    name: docker build (no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The builder stage cross-compiles on the runner's platform, so arm64
      # needs no emulation.
      - name: build linux/amd64 + linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: pingap-k8s:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: e2e (kind ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Oldest Kubernetes minor still supported upstream, and the newest kindest/node.
        node:
          - kindest/node:v1.35.8
          - kindest/node:v1.37.0
    env:
      KIND_VERSION: v0.33.0
      KIND_NODE_IMAGE: ${{ matrix.node }}
      E2E_IMAGE: pingap-k8s:e2e
      # Scheduled runs test the newest Pingap image instead of the pinned tag.
      E2E_PINGAP_TAG: ${{ github.event_name == 'schedule' && 'latest' || '' }}
      # Built below with the gha cache; e2e-up.sh only loads it into kind.
      E2E_SKIP_BUILD: "1"
      # Kept until teardown so a failure can be inspected in the next step.
      E2E_KEEP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build controller image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.E2E_IMAGE }}
          cache-from: type=gha

      - name: e2e
        run: scripts/e2e-run.sh

      - name: diagnostics
        if: failure()
        run: |
          export KUBECONFIG=target/e2e/kubeconfig
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n pingap-k8s logs -l app.kubernetes.io/instance=pingap-k8s --all-containers --prefix --tail=200 || true

      - name: teardown
        if: always()
        run: scripts/e2e-down.sh
