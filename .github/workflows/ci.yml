name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HELM_VERSION: v4.3.1

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # etcd-client generates its gRPC code with protoc at build time;
      # libprotobuf-dev provides the well-known .proto files it imports.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

  helm:
    name: helm lint and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: make helm-lint

      - name: helm template
        run: make helm-template

      - name: plain manifests are up to date
        run: make manifests-check

      - name: no public exposure of etcd, metrics or admin; no ClusterRole
        run: make exposure-check

  docker:
    name: docker build (no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The builder stage cross-compiles on the runner's platform, so arm64
      # needs no emulation.
      - name: build linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: pingap-k8s:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
