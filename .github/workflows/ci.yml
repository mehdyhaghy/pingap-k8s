name: ci

# Not run on every push: run it by hand while developing (Actions > ci > Run
# workflow, or `gh workflow run ci`), and the release workflow runs all of it
# before it publishes anything.
on:
  workflow_dispatch:
    inputs:
      pingap-latest:
        description: Run the e2e tests against the newest Pingap image instead of the pinned one
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HELM_VERSION: v4.3.1

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # etcd-client generates its gRPC code with protoc at build time;
      # libprotobuf-dev provides the well-known .proto files it imports.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      # The plugin crate as crates.io gets it: packaged alone and built without the
      # controller (no protoc).
      - name: package kubectl-pingap
        run: cargo package -p kubectl-pingap --locked

  plugin-windows:
    name: kubectl-pingap on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Unit tests only: the end-to-end tests run a shell script as kubectl (Unix).
      - name: test
        run: cargo test -p kubectl-pingap --locked

  helm:
    name: helm lint and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: make helm-lint

      - name: helm template
        run: make helm-template

      - name: plain manifests are up to date
        run: make manifests-check

      - name: no public exposure of etcd, metrics or admin; no cluster-wide RBAC but the read-only gateway ClusterRole
        run: make exposure-check

      - name: version follows the Pingap version
        run: make version-check

  integration:
    name: integration (etcd, kind watchers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ETCD_VERSION: v3.7.3
      # etcd-<version>-linux-amd64.tar.gz in that release's SHA256SUMS.
      ETCD_SHA256: 5dfa9cc3b3ce3b4b491fbcc2057d3daa166bcc6676f743fcd20f8e5760cb9775
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install etcd and kind
        run: |
          curl -fsSLo etcd.tar.gz "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          echo "${ETCD_SHA256}  etcd.tar.gz" | sha256sum -c -
          tar -xzf etcd.tar.gz --strip-components=1 "etcd-${ETCD_VERSION}-linux-amd64/etcd"
          sudo mv etcd /usr/local/bin/etcd
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          etcd --version
          kind version

      # tests/etcd_*.rs against a throwaway etcd on 127.0.0.1 (skipped by plain cargo test).
      - name: etcd integration tests
        run: scripts/test-etcd.sh --locked

      # tests/watch_kind.rs against a throwaway kind cluster.
      - name: kind watcher tests
        run: scripts/test-kind.sh --locked

  # Secrets in the whole git history and the working tree (.gitleaks.toml).
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      # gitleaks_<version>_linux_x64.tar.gz in that release's checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install gitleaks
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz

      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .

  dependencies:
    name: dependency advisories and licenses
    runs-on: ubuntu-24.04
    env:
      # The release binary (static musl build), checked against the release's digest;
      # compiling it with cargo install took about 4 minutes.
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install cargo-audit
        run: |
          set -euo pipefail
          name="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -fsSLo cargo-audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${name}.tgz"
          echo "${CARGO_AUDIT_SHA256}  cargo-audit.tgz" | sha256sum -c -
          tar -xzf cargo-audit.tgz -C "$RUNNER_TEMP" --strip-components=1 "${name}/cargo-audit"
          rm cargo-audit.tgz

      # RustSec advisories for every crate in Cargo.lock.
      - name: cargo audit
        run: '"$RUNNER_TEMP/cargo-audit" audit'

      - name: install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo cargo-deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tgz" | sha256sum -c -
          tar -xzf cargo-deny.tgz -C "$RUNNER_TEMP" --strip-components=1 "${name}/cargo-deny"
          rm cargo-deny.tgz

      # Dependency licenses against the CNCF allowlist, and crate sources (deny.toml).
      - name: cargo deny
        run: '"$RUNNER_TEMP/cargo-deny" --locked check licenses sources'

  docker:
    name: docker build (no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The builder stage cross-compiles on the runner's platform, so arm64
      # needs no emulation.
      - name: build linux/amd64 + linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: pingap-k8s:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: e2e (kind ${{ matrix.node }}${{ matrix.ipFamily == 'dual' && ', dual-stack' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The supported Kubernetes minor (1.37), the newest kindest/node.
        node:
          - kindest/node:v1.37.0
        ipFamily: [ipv4]
        include:
          # Dual-stack nodes and pods: the controller ([::]:9090) and the seeded
          # Pingap listener ([::]:8080) must serve IPv4 there too. The test app's
          # Services stay single-stack IPv4, so the expected addrs do not change.
          - node: kindest/node:v1.37.0
            ipFamily: dual
    env:
      KIND_VERSION: v0.33.0
      # kind-linux-amd64.sha256sum of that release.
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KIND_NODE_IMAGE: ${{ matrix.node }}
      E2E_IMAGE: pingap-k8s:e2e
      # Scheduled runs test the newest Pingap image instead of the pinned tag.
      E2E_PINGAP_TAG: ${{ inputs.pingap-latest && 'latest' || '' }}
      # Built below with the gha cache; e2e-up.sh only loads it into kind.
      E2E_SKIP_BUILD: "1"
      # Kept until teardown so a failure can be inspected in the next step.
      E2E_KEEP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build controller image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.E2E_IMAGE }}
          cache-from: type=gha

      - name: kind config (dual-stack)
        if: matrix.ipFamily == 'dual'
        run: |
          cat >"$RUNNER_TEMP/kind-dual-stack.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            ipFamily: dual
          EOF
          echo "KIND_CONFIG=$RUNNER_TEMP/kind-dual-stack.yaml" >>"$GITHUB_ENV"

      - name: e2e
        run: scripts/e2e-run.sh

      - name: diagnostics
        if: failure()
        run: |
          export KUBECONFIG=target/e2e/kubeconfig
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n pingap-k8s logs -l app.kubernetes.io/instance=pingap-k8s --all-containers --prefix --tail=200 || true

      - name: teardown
        if: always()
        run: scripts/e2e-down.sh
