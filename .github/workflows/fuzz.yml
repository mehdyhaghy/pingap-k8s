name: fuzz

# The fuzz targets in fuzz/ (cargo-afl, AFL++): weekly, or by hand with a
# duration per target. A crash fails the job and uploads the input that caused it.
on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        type: number
        default: 600

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_AFL_VERSION: 0.18.2

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [config, etcd_toml, server_toml, translate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # etcd-client generates its gRPC code with protoc at build time;
      # libprotobuf-dev provides the well-known .proto files it imports.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          # cargo afl builds with -C target-cpu=native: build output (proc macros included)
          # from one runner's CPU can die with SIGILL on another's.
          cache-targets: false

      # Installing cargo-afl also builds AFL++ and its runtime for the current rustc. --force:
      # rust-cache restores ~/.cargo/bin, and without it cargo skips the install when that
      # holds the same cargo-afl, so a newer stable rustc found no runtime.
      - name: Install cargo-afl
        run: cargo install cargo-afl --version "$CARGO_AFL_VERSION" --locked --force

      - name: Run ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || 600 }}
          AFL_NO_UI: "1"
          AFL_SKIP_CPUFREQ: "1"
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
        run: |
          cd fuzz
          cargo afl build --release
          mkdir -p out
          dict=()
          if [ -f "dicts/$TARGET.dict" ]; then
            dict=(-x "dicts/$TARGET.dict")
          fi
          cargo afl fuzz -i "seeds/$TARGET" -o "out/$TARGET" -V "$SECONDS_PER_TARGET" \
            -t 30000 -m none "${dict[@]}" "target/release/$TARGET"
          # afl-fuzz exits 0 even when it found crashes. Its file names hold colons, which
          # artifacts do not allow: each crash is copied to crashes/crash-<n>, with the
          # output of a replay (the panic message) in crash-<n>.log and the AFL++ name in
          # crash-<n>.name.
          mkdir -p crashes
          crashes=0
          for f in "out/$TARGET/default/crashes"/id:*; do
            [ -f "$f" ] || continue
            crashes=$((crashes + 1))
            c="crashes/crash-$crashes"
            cp "$f" "$c"
            basename "$f" >"$c.name"
            RUST_BACKTRACE=1 timeout 60 "target/release/$TARGET" <"$f" >"$c.log" 2>&1 || true
            echo "::group::crash-$crashes ($(basename "$f"))"
            grep -A3 -m1 -E "panicked|overflowed" "$c.log" || tail -n 5 "$c.log"
            echo "::endgroup::"
          done
          echo "$crashes crash input(s)"
          test "$crashes" -eq 0

      - name: Upload the crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/crashes
          if-no-files-found: ignore
          retention-days: 30
