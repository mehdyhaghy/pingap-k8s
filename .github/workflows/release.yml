name: release

# Publishes a release from a `v<version>` tag: the multi-arch image, the Helm
# chart (OCI) and a GitHub Release with the chart package, plain manifests, the
# kubectl-pingap plugin (linux/darwin amd64/arm64, windows amd64, with checksums)
# and a krew manifest for it, then publishes the kubectl-pingap crate on crates.io
# (trusted publishing). The plugin is not part of the image.
# The image and the chart are signed with cosign (keyless, Sigstore), and so are
# the release files (a .sigstore.json bundle next to each). The signer identity is
# this workflow; Sigstore's public transparency log records it (repository name,
# workflow path and tag).
# A manual run defaults to a dry run that builds everything and publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build the image, chart and manifests without pushing or releasing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HELM_VERSION: v4.3.1
  IMAGE: ghcr.io/mehdyhaghy/pingap-k8s
  CHART_REPO: oci://ghcr.io/mehdyhaghy/charts
  CHART: charts/pingap-k8s

jobs:
  # The whole ci workflow (tests, integration, e2e on every Kubernetes version,
  # secret scan, advisories): nothing is built for publishing unless it passes.
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify:
    name: verify versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
      tag: ${{ steps.versions.outputs.tag }}
      publish: ${{ steps.versions.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tag, Cargo.toml, Chart.yaml and the Pingap version agree
        id: versions
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          fail=0
          cargo_version=$(scripts/check-version.sh) || fail=1
          echo "version: $cargo_version"

          publish=false
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$cargo_version" ]; then
              echo "::error::tag $REF_NAME does not match v$cargo_version from Cargo.toml"; fail=1
            fi
            if [ "$EVENT" = "push" ] || [ "$DRY_RUN" = "false" ]; then publish=true; fi
          elif [ "$DRY_RUN" = "false" ]; then
            echo "::error::a non dry-run release must run on a v* tag, not $REF_TYPE $REF_NAME"; fail=1
          fi
          [ "$fail" = 0 ] || exit 1

          {
            echo "version=$cargo_version"
            echo "tag=v$cargo_version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "publish: $publish"

  rust:
    name: fmt, clippy, test
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # etcd-client generates its gRPC code with protoc at build time;
      # libprotobuf-dev provides the well-known .proto files it imports.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

  helm:
    name: helm lint and manifests
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: make helm-lint

      - name: helm template
        run: make helm-template

      - name: plain manifests are up to date
        run: make manifests-check

      - name: no public exposure of etcd, metrics or admin; no cluster-wide RBAC but the read-only gateway ClusterRole
        run: make exposure-check

  image:
    name: image (linux/amd64, linux/arm64)
    needs: [ci, verify, rust, helm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's OIDC token gets the Sigstore certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr.io
        if: needs.verify.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The builder stage cross-compiles on the runner's platform, so arm64
      # needs no emulation.
      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.publish == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: needs.verify.outputs.publish == 'true'
        with:
          cosign-release: v3.1.4

      # Signs the multi-arch index by digest, so both tags are covered.
      - name: sign image
        if: needs.verify.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # kubectl plugin (the kubectl-pingap crate, which does not need protoc), built
  # natively on each platform. Linux builds use Ubuntu 22.04 for an older glibc
  # baseline.
  plugin:
    name: kubectl-pingap (${{ matrix.os }}/${{ matrix.arch }})
    needs: [ci, verify, rust]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: darwin, arch: amd64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { os: darwin, arch: arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { os: windows, arch: amd64, runner: windows-2025, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: plugin-${{ matrix.target }}

      - name: build
        run: cargo build --release --locked -p kubectl-pingap --target "$TARGET"

      # A .tar.gz for Linux and macOS, a .zip for Windows (kubectl-pingap.exe).
      - name: package
        run: |
          set -euo pipefail
          name="kubectl-pingap_${VERSION}_${OS}_${ARCH}"
          exe=kubectl-pingap
          [ "$OS" = windows ] && exe=kubectl-pingap.exe
          mkdir -p staging dist
          cp "target/$TARGET/release/$exe" LICENSE staging/
          "./staging/$exe" --version
          if [ "$OS" = windows ]; then
            archive="$name.zip"
            (cd staging && 7z a -tzip "../dist/$archive" "$exe" LICENSE > /dev/null)
          else
            archive="$name.tar.gz"
            tar -czf "dist/$archive" -C staging "$exe" LICENSE
          fi
          # "<sha256>  <file>" on every runner (shasum on macOS; no "*" binary marker).
          if command -v sha256sum > /dev/null; then sum=$(sha256sum "dist/$archive"); else sum=$(shasum -a 256 "dist/$archive"); fi
          echo "${sum%% *}  $archive" > "dist/$archive.sha256"
          cat "dist/$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: chart and GitHub Release
    needs: [verify, image, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
      PUBLISH: ${{ needs.verify.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: package chart
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "$CHART" --destination dist --version "$VERSION" --app-version "$VERSION"
          ls -l dist

      - name: render plain manifests
        run: |
          set -euo pipefail
          {
            echo "# pingap-k8s $VERSION plain manifests, rendered from the $CHART chart with the"
            echo "# default values and image $IMAGE:$VERSION."
            echo "#"
            echo "# Before applying: create the namespace, edit the etcd URL in the ConfigMap, the"
            echo "# upstreams, and add a Role + RoleBinding for every namespace your Services are in."
            echo "#   kubectl create namespace pingap-k8s"
            echo "#   kubectl apply -f pingap-k8s.yaml"
            helm template pingap-k8s "$CHART" --namespace pingap-k8s --set "image.tag=$VERSION"
          } > dist/pingap-k8s.yaml
          grep -n "image: $IMAGE:$VERSION" dist/pingap-k8s.yaml

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true

      - name: plugin checksums and krew manifest
        run: |
          set -euo pipefail
          cd dist
          cat kubectl-pingap_"$VERSION"_*.sha256 > "kubectl-pingap_${VERSION}_checksums.txt"
          rm kubectl-pingap_"$VERSION"_*.sha256
          sha256sum -c "kubectl-pingap_${VERSION}_checksums.txt"
          sha() { grep " kubectl-pingap_${VERSION}_$1\$" "kubectl-pingap_${VERSION}_checksums.txt" | cut -d' ' -f1; }
          SHA256_LINUX_AMD64=$(sha linux_amd64.tar.gz)
          SHA256_LINUX_ARM64=$(sha linux_arm64.tar.gz)
          SHA256_DARWIN_AMD64=$(sha darwin_amd64.tar.gz)
          SHA256_DARWIN_ARM64=$(sha darwin_arm64.tar.gz)
          SHA256_WINDOWS_AMD64=$(sha windows_amd64.zip)
          export SHA256_LINUX_AMD64 SHA256_LINUX_ARM64 SHA256_DARWIN_AMD64 SHA256_DARWIN_ARM64 SHA256_WINDOWS_AMD64
          # shellcheck disable=SC2016 # the variable names are envsubst's argument
          envsubst '${VERSION} ${SHA256_LINUX_AMD64} ${SHA256_LINUX_ARM64} ${SHA256_DARWIN_AMD64} ${SHA256_DARWIN_ARM64} ${SHA256_WINDOWS_AMD64}' \
            < ../krew/pingap.yaml > pingap.yaml
          if grep -n '[$]{' pingap.yaml; then echo "::error::unfilled placeholder in pingap.yaml"; exit 1; fi
          [ "$(grep -c 'sha256: [0-9a-f]\{64\}$' pingap.yaml)" = 5 ] || { echo "::error::expected 5 sha256 lines"; exit 1; }
          ls -l

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLISH == 'true'
        with:
          cosign-release: v3.1.4

      # One bundle per release file; the checksums file covers the plugin tarballs.
      - name: sign release files
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          cd dist
          for f in "pingap-k8s-$VERSION.tgz" pingap-k8s.yaml "kubectl-pingap_${VERSION}_checksums.txt" pingap.yaml; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: push and sign chart in ${{ env.CHART_REPO }}
        if: env.PUBLISH == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/pingap-k8s-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: *//p' push.log)
          [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
          echo "$GHCR_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          cosign sign --yes "${CHART_REPO#oci://}/pingap-k8s@$digest"

      - name: create GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "dist/pingap-k8s-$VERSION.tgz" \
            "dist/pingap-k8s.yaml#pingap-k8s.yaml" \
            dist/kubectl-pingap_"$VERSION"_*.tar.gz \
            dist/kubectl-pingap_"$VERSION"_*.zip \
            "dist/kubectl-pingap_${VERSION}_checksums.txt" \
            "dist/pingap.yaml#pingap.yaml (krew manifest)" \
            dist/*.sigstore.json

      - name: dry run summary
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "### Dry run: nothing was pushed or released"
            echo "- image: $IMAGE:$VERSION (built, not pushed)"
            echo "- chart: dist/pingap-k8s-$VERSION.tgz (not pushed to $CHART_REPO)"
            echo "- manifests: dist/pingap-k8s.yaml"
            echo "- kubectl plugin: dist/kubectl-pingap_${VERSION}_*.{tar.gz,zip}, krew manifest dist/pingap.yaml"
            echo "- crate: kubectl-pingap $VERSION (not published to crates.io)"
            echo "- signatures: none (cosign signs only on publish)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

  # The kubectl-pingap crate on crates.io, after the GitHub Release (cargo binstall
  # downloads its archives). Trusted publishing: a short-lived token from GitHub's
  # OIDC identity, no stored secret. crates.io allows it for this repository and
  # workflow (crate settings > Trusted Publishing). A version that is already on
  # crates.io is skipped, so a rerun or a version published by hand does not fail.
  crate:
    name: kubectl-pingap on crates.io
    needs: [verify, release]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: already published?
        id: exists
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "pingap-k8s release (github.com/mehdyhaghy/pingap-k8s)" \
            "https://crates.io/api/v1/crates/kubectl-pingap/$VERSION")
          echo "crates.io kubectl-pingap $VERSION: HTTP $code"
          echo "skip=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.exists.outputs.skip != 'true'
        with:
          toolchain: stable

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.exists.outputs.skip != 'true'
        id: auth

      - name: cargo publish
        if: steps.exists.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p kubectl-pingap --locked
