# Secret scan (CI job "secrets", or locally: gitleaks git . && gitleaks dir .).
# The default rules, minus known false positives.
[extend]
useDefault = true

[[allowlists]]
description = "Kubernetes Secret names (not values) and the RFC 6455 sample WebSocket key"
regexTarget = "match"
regexes = [
  '''tlsSecret[=:]\s*pingap-k8s-etcd''',
  '''Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==''',
]

[[allowlists]]
description = "Build output"
paths = ['''^target/''']

[[allowlists]]
description = "Test fixtures: the test-only JWTs of e2e test 17"
targetRules = ["jwt"]
paths = ['''^tests/e2e/spec\.rs$''']

[[allowlists]]
description = "Pinned release checksums and commit ids of the Gateway API CRDs"
regexTarget = "match"
regexes = [
  '''GATEWAY_API_(SHA256|COMMIT)=''',
]
