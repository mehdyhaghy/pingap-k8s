# Fuzz targets (cargo-fuzz, libFuzzer). Not part of the workspace and never published;
# see "Fuzzing" in CONTRIBUTING.md.
[package]
name = "pingap-k8s-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1.5"
k8s-openapi = { version = "0.29", default-features = false, features = ["v1_37"] }
# Bundles LLVM's libFuzzer (NCSA license, not on the CNCF allowlist): a test tool, never
# part of a release.
libfuzzer-sys = "0.4.13"
pingap-k8s = { path = ".." }
rcgen = "0.14.10"
serde = "1"
serde_json = "1"
toml = "1"

# Its own workspace: the fuzz crate builds with a nightly toolchain and has its own
# lock file.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "etcd_toml"
path = "fuzz_targets/etcd_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_toml"
path = "fuzz_targets/server_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "translate"
path = "fuzz_targets/translate.rs"
test = false
doc = false
bench = false
