[etcd]
url = "etcd://etcd.edge.svc:2379/pingap?ca=/etc/pingap-k8s/etcd/ca.pem&user=u&password=p"

[kubernetes]
default_namespace = ""
cluster_domain = "cluster.local"

[defaults]
debounce = "500ms"
debounce_max = "2s"
resync = "5m"
ip_family = "primary"
target = "service"

[server]
status_listen = "127.0.0.1:9091"

[gateway]
enabled = true
controller_name = "pingap.io/gateway-controller"
servers = ["http", "https"]
addresses = ["192.0.2.1"]
health_check = "http://web/ping"

[[gateway.groups]]
name = "own"
servers = ["own"]
addresses = ["192.0.2.2"]
ports = ["80:10080"]

[upstreams.api]
services = ["api.prod:http"]
ip_family = "both"

[upstreams.web]
services = ["web-blue.prod:http 9", "web-green.prod:80 1"]
drain_terminating = true
