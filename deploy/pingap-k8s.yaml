---
# Source: pingap-k8s/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingap-k8s
  namespace: pingap-k8s
  labels:
    helm.sh/chart: pingap-k8s-0.1.0
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pingap-k8s
    app.kubernetes.io/name: pingap-k8s
    app.kubernetes.io/instance: pingap-k8s
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pingap-k8s
      app.kubernetes.io/instance: pingap-k8s
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pingap-k8s
        app.kubernetes.io/instance: pingap-k8s
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: pingap-k8s
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/mehdyhaghy/pingap-k8s:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/pingap-k8s/config/config.toml
            - --log-format
            - text
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/pingap-k8s/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pingap-k8s-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pingap-k8s
                    app.kubernetes.io/instance: pingap-k8s
                    app.kubernetes.io/component: controller
