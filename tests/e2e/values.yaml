# Helm values for the end-to-end harness (scripts/e2e-up.sh): the same shape as
# charts/pingap-k8s/ci/quickstart-values.yaml (used alone, so its "quickstart"
# upstream does not have to be removed). Release "pingap-k8s" in namespace
# "pingap-k8s", so object names are pingap-k8s, pingap-k8s-etcd, pingap-k8s-pingap...
#
# The controller image is built locally and loaded into kind (never pulled).
image:
  repository: pingap-k8s
  tag: e2e
  pullPolicy: Never

logLevel: "info,pingap_k8s=debug"

# E2E test 14: Kubernetes Events (adds create/patch on events.k8s.io events to the Roles).
events:
  enabled: true

# The tests scrape the controller's metrics from the client pod.
networkPolicy:
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: e2e-app

etcd:
  deploy: true
  replicas: 1
  # Keep the PVC: e2e test 8 stops etcd (scale to 0) and expects the data back.
  persistence:
    enabled: true
    size: 1Gi

pingap:
  deploy: true
  service:
    # Only reached from inside the cluster (client pod in the app namespace).
    type: ClusterIP
  admin:
    # Created by e2e-up.sh (keys user, password) before the install, so the
    # tests know the credentials without reading the chart's generated Secret.
    existingSecret: pingap-k8s-pingap-admin-e2e
  networkPolicy:
    # The gRPC listener of e2e test 12.
    extraPorts: [8081]
    # E2E tests 9 and 10 call the admin API from the client pod.
    adminFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: e2e-app
  seed:
    enabled: true
    # Listener 8080: "/ws" goes to the WebSocket port of the echo pods, "/sse" to
    # the httpbin pods, everything else to the echo HTTP port. E2E tests 15 to 18 have
    # a prefix each, stripped by a rewrite: "/headers-test/" (httpbin, forwarded
    # headers), "/sticky/" (echo pods with a sticky cookie), "/jwt/" and "/fwd/"
    # (httpbin behind the jwt and forward_auth plugins), "/svc/" (target = "service").
    # Listener 8081: HTTP/2 without TLS (h2c, enabled_h2) for gRPC,
    # every path to the podinfo gRPC port over h2c (alpn "H2"), with a gRPC health
    # check. A separate listener, so the HTTP/1 tests on 8080 are unaffected; the
    # test reaches it by Pingap pod IP (the chart's Service has one port).
    # Every upstream starts with a placeholder address the controller replaces.
    config: |
      # Same shutdown budget as the chart default seed: preStop 15s + 30s + 10s < 60s.
      [basic]
      grace_period = "30s"
      graceful_shutdown_timeout = "10s"

      [servers.e2e]
      addr = "[::]:8080"
      locations = ["echo-ws", "httpbin-sse", "headers", "sticky", "jwt", "fwd", "svc", "echo"]

      [servers.grpc]
      addr = "[::]:8081"
      enabled_h2 = true
      locations = ["grpc"]

      [locations.echo]
      upstream = "echo"

      [locations.echo-ws]
      upstream = "echo-ws"
      path = "/ws"

      [locations.httpbin-sse]
      upstream = "httpbin"
      path = "/sse"

      [locations.grpc]
      upstream = "grpc"

      [locations.headers]
      upstream = "httpbin"
      path = "/headers-test/"
      rewrite = "^/headers-test/(.*)$ /$1"
      enable_reverse_proxy_headers = true
      proxy_set_headers = ["X-E2E-Set:on"]

      [locations.sticky]
      upstream = "echo-sticky"
      path = "/sticky/"
      rewrite = "^/sticky/(.*)$ /$1"

      [locations.jwt]
      upstream = "httpbin"
      path = "/jwt/"
      rewrite = "^/jwt/(.*)$ /$1"
      plugins = ["e2eJwt"]

      [locations.fwd]
      upstream = "httpbin"
      path = "/fwd/"
      rewrite = "^/fwd/(.*)$ /$1"
      plugins = ["e2eForwardAuth"]

      [locations.svc]
      upstream = "echo-svc"
      path = "/svc/"
      rewrite = "^/svc/(.*)$ /$1"

      # HS256 with a test-only secret; the tokens are in tests/e2e/spec.rs.
      [plugins.e2eJwt]
      category = "jwt"
      header = "Authorization"
      secret = "e2e-jwt-secret"
      algorithm = "HS256"
      claims_to_headers = ["sub:X-User"]

      # go-httpbin's /bearer answers 200 to any bearer token and 401 without one.
      [plugins.e2eForwardAuth]
      category = "forward_auth"
      auth_url = "http://httpbin.e2e-app.svc:80/bearer"
      request_headers = ["Authorization"]
      timeout = "3s"

      [upstreams.echo]
      addrs = ["127.0.0.1:9"]

      [upstreams.echo-ws]
      addrs = ["127.0.0.1:9"]

      [upstreams.httpbin]
      addrs = ["127.0.0.1:9"]

      [upstreams.echo-sticky]
      addrs = ["127.0.0.1:9"]
      algo = "sticky:e2e-sticky"

      # E2E test 18 deletes this entry so the controller creates it ("service" target).
      [upstreams.echo-svc]
      addrs = ["127.0.0.1:9"]

      [upstreams.grpc]
      addrs = ["127.0.0.1:9"]
      alpn = "H2"
      max_h2_streams = 100
      health_check = "grpc://podinfo?service=podinfo&connection_timeout=2s&read_timeout=2s&check_frequency=5s"

config:
  upstreams:
    echo:
      services: ["echo.e2e-app:http"]
    echo-ws:
      services: ["echo.e2e-app:ws"]
    httpbin:
      services: ["httpbin.e2e-app:http"]
    grpc:
      services: ["podinfo.e2e-app:grpc"]
    echo-sticky:
      services: ["echo.e2e-app:http"]
    echo-svc:
      services: ["echo-svc.e2e-app:http"]
      target: service
