# Helm values for the end-to-end harness (scripts/e2e-up.sh): the same shape as
# charts/pingap-k8s/ci/quickstart-values.yaml (used alone, so its "quickstart"
# upstream does not have to be removed). Release "pingap-k8s" in namespace
# "pingap-k8s", so object names are pingap-k8s, pingap-k8s-etcd, pingap-k8s-pingap...
#
# The controller image is built locally and loaded into kind (never pulled).
image:
  repository: pingap-k8s
  tag: e2e
  pullPolicy: Never

logLevel: "info,pingap_k8s=debug"

# E2E test 14: Kubernetes Events (adds create/patch on events.k8s.io events to the Roles).
events:
  enabled: true

# The tests scrape the controller's metrics from the client pod.
networkPolicy:
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: e2e-app

etcd:
  deploy: true
  replicas: 1
  # Keep the PVC: e2e test 8 stops etcd (scale to 0) and expects the data back.
  persistence:
    enabled: true
    size: 1Gi

pingap:
  deploy: true
  service:
    # Only reached from inside the cluster (client pod in the app namespace).
    type: ClusterIP
  admin:
    # Created by e2e-up.sh (keys user, password) before the install, so the
    # tests know the credentials without reading the chart's generated Secret.
    existingSecret: pingap-k8s-pingap-admin-e2e
  networkPolicy:
    # The gRPC listener of e2e test 12.
    extraPorts: [8081]
    # E2E tests 9 and 10 call the admin API from the client pod.
    adminFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: e2e-app
  seed:
    enabled: true
    # Listener 8080: "/ws" goes to the WebSocket port of the echo pods, "/sse" to
    # the httpbin pods, everything else to the echo HTTP port.
    # Listener 8081: HTTP/2 without TLS (h2c, enabled_h2) for gRPC,
    # every path to the podinfo gRPC port over h2c (alpn "H2"), with a gRPC health
    # check. A separate listener, so the HTTP/1 tests on 8080 are unaffected; the
    # test reaches it by Pingap pod IP (the chart's Service has one port).
    # Every upstream starts with a placeholder address the controller replaces.
    config: |
      # Same shutdown budget as the chart default seed: preStop 15s + 30s + 10s < 60s.
      [basic]
      grace_period = "30s"
      graceful_shutdown_timeout = "10s"

      [servers.e2e]
      addr = "[::]:8080"
      locations = ["echo-ws", "httpbin-sse", "echo"]

      [servers.grpc]
      addr = "[::]:8081"
      enabled_h2 = true
      locations = ["grpc"]

      [locations.echo]
      upstream = "echo"

      [locations.echo-ws]
      upstream = "echo-ws"
      path = "/ws"

      [locations.httpbin-sse]
      upstream = "httpbin"
      path = "/sse"

      [locations.grpc]
      upstream = "grpc"

      [upstreams.echo]
      addrs = ["127.0.0.1:9"]

      [upstreams.echo-ws]
      addrs = ["127.0.0.1:9"]

      [upstreams.httpbin]
      addrs = ["127.0.0.1:9"]

      [upstreams.grpc]
      addrs = ["127.0.0.1:9"]
      alpn = "H2"
      max_h2_streams = 100
      health_check = "grpc://podinfo?service=podinfo&connection_timeout=2s&read_timeout=2s&check_frequency=5s"

config:
  upstreams:
    echo:
      services: ["echo.e2e-app:http"]
    echo-ws:
      services: ["echo.e2e-app:ws"]
    httpbin:
      services: ["httpbin.e2e-app:http"]
    grpc:
      services: ["podinfo.e2e-app:grpc"]
