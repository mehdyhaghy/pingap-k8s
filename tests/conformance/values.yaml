# Helm values for the Gateway API conformance run (scripts/conformance.sh): the
# bundled etcd and the quickstart Pingap with the listeners the conformance
# Gateways use. Release "pingap-k8s" in namespace "pingap-k8s".
#
# The controller image is built locally and loaded into kind (never pulled).
image:
  repository: pingap-k8s
  tag: conformance
  pullPolicy: Never

logLevel: "info,pingap_k8s=debug"

# Gateway API provider: the GatewayClass "pingap". Backends and listener Secrets
# live in the namespaces of conformance/base/manifests.yaml (created by the script
# before the install, so the Roles can go there). The shared addresses are the
# pingap-k8s-gateway Service the script creates (ports 80, 443, 8080, 8090), the
# address the in-cluster suite sends its requests to (and the usable address of
# GatewayStaticAddresses).
#
# Server groups: one per Gateway of conformance/base/manifests.yaml (same-namespace,
# same-namespace-with-https-listener, all-namespaces, backend-namespaces; created
# first, so they are the oldest and take them), each with a plain HTTP server for
# port 80 and a TLS server for port 443 and a Service of its own
# (pingap-k8s-pingap-gw-<name>), so routes of different base Gateways never mix
# (HTTPRouteMultipleGateways, GRPCRouteMultipleGateways). The Gateways the tests
# create share the seed's servers below. The plain group servers set enabled_h2
# (h2c), which the GRPCRoute tests and HTTPRouteBackendProtocolH2C need.
gateway:
  enabled: true
  namespaces:
    - gateway-conformance-infra
    - gateway-conformance-app-backend
    - gateway-conformance-web-backend
  addresses: ["pingap-k8s-gateway.pingap-k8s.svc"]
  groups:
    - name: g1
      ports:
        - { port: 80, targetPort: 9101, settings: { enabled_h2: true } }
        - { port: 443, targetPort: 9401, tls: true }
    - name: g2
      ports:
        - { port: 80, targetPort: 9102, settings: { enabled_h2: true } }
        - { port: 443, targetPort: 9402, tls: true }
    - name: g3
      ports:
        - { port: 80, targetPort: 9103, settings: { enabled_h2: true } }
        - { port: 443, targetPort: 9403, tls: true }
    - name: g4
      ports:
        - { port: 80, targetPort: 9104, settings: { enabled_h2: true } }
        - { port: 443, targetPort: 9404, tls: true }

etcd:
  deploy: true
  replicas: 1
  persistence:
    enabled: false

pingap:
  deploy: true
  # The chart's proxy Service and readiness probe use the port-80 listener.
  httpPort: 80
  service:
    type: ClusterIP
    port: 80
  # Pingap runs as non-root: let it bind ports below 1024 (a namespaced, safe sysctl).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"
  networkPolicy:
    extraPorts: [443, 8080, 8090]
  seed:
    enabled: true
    # One server per listener port of the conformance Gateways: 80, 8080 and 8090
    # plain HTTP, 443 HTTPS with the certificates the controller stores. The
    # controller lists its generated locations on them. The chart adds the
    # servers of gateway.groups (ports 9101-9104 and 9401-9404). The plain servers
    # also speak HTTP/2 with prior knowledge (enabled_h2: h2c), which GRPCRoutes
    # (profile GATEWAY-GRPC) and HTTPRouteBackendProtocolH2C need.
    config: |
      [basic]
      grace_period = "30s"
      graceful_shutdown_timeout = "10s"

      [servers.gw-80]
      addr = "[::]:80"
      enabled_h2 = true

      [servers.gw-443]
      addr = "[::]:443"
      global_certificates = true
      strict_sni = true

      [servers.gw-8080]
      addr = "[::]:8080"
      enabled_h2 = true

      [servers.gw-8090]
      addr = "[::]:8090"
      enabled_h2 = true
