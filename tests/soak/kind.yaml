# kind cluster for scripts/soak.sh: one control-plane node (never failed; it runs the
# API server and the soak client) and three workers that the chaos loop drains and
# pauses one at a time.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
